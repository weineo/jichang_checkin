name: iKuuu Check-in

on:
  schedule:
    - cron: '32 22 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check-in
        env:
          # 主凭据：登录 Cookie，一个账号一行（用 get_cookie.py 获取）
          COOKIE: ${{ secrets.COOKIE }}
          # 可选
          URL: ${{ secrets.URL }}
          SCKEY: ${{ secrets.SCKEY }}
        run: python checkin.py
